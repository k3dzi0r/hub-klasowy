name: Windows package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  package-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run pakiet:windows

      - name: Spakuj do ZIP
        shell: pwsh
        run: 7z a -tzip "release/Hub-klasowy-windows.zip" "./release/Hub klasowy"

      - name: Zbuduj instalator (Inno Setup)
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { (Get-Content package.json | ConvertFrom-Json).version }
          & $iscc "/DAppVersion=$version" scripts/instalator-windows.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      # Ręczne uruchomienie: instalator i ZIP do pobrania jako artefakty workflow.
      - uses: actions/upload-artifact@v4
        with:
          name: hub-klasowy-windows
          path: |
            release/Hub-klasowy-setup.exe
            release/Hub-klasowy-windows.zip

      # Tag v*: instalator i ZIP dołączone do szkicu GitHub Release.
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Hub klasowy ${{ github.ref_name }}
          draft: true
          files: |
            release/Hub-klasowy-setup.exe
            release/Hub-klasowy-windows.zip
